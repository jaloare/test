<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🪙 LifeCoins</title>
  <style>
    :root {
      --bg-color: #f0f4f8;
      --text-color: #333;
      --container-bg: #fff;
      --label-color: #666;
      --message-color: #999;
    }
    body.dark {
      --bg-color: #1e1e1e;
      --text-color: #f5f5f5;
      --container-bg: #2b2b2b;
      --label-color: #bbb;
      --message-color: #888;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: var(--bg-color);
      overflow: hidden;
      color: var(--text-color);
      transition: background 0.3s, color 0.3s;
    }
    .container {
      text-align: center;
      background: var(--container-bg);
      border-radius: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      padding: 20px 15px;
      max-width: 360px;
      width: 90%;
      position: relative;
      z-index: 1;
      transition: background 0.3s, color 0.3s;
    }
    .life-coins {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.2rem;
      flex-wrap: wrap;
      z-index: 2;
    }
    .label {
      font-size: 1rem;
      margin-top: 10px;
      color: var(--label-color);
    }
    .message {
      margin-top: 10px;
      font-size: 0.95rem;
      color: var(--message-color);
    }
    .toggle-dark {
      position: absolute;
      top: 10px;
      right: 10px;
      background: transparent;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-color);
      transition: color 0.3s;
    }
    @media (max-width: 400px) {
      .life-coins {
        font-size: 1.8rem;
      }
    }

    /* ANIMACIÓN DE MONEDAS CAYENDO */
    .coin {
      position: absolute;
      top: -50px;
      font-size: 1.5rem;
      animation: fall linear infinite;
      opacity: 0.8;
      z-index: 0;
    }
    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.8;
      }
      100% {
        transform: translateY(120vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="toggle-dark" id="toggleDark">🌙</button>
    <h1 style="margin-bottom: 15px;">🪙 LifeCoins</h1>
    <div class="life-coins" id="life-coins">
      <!-- Example: 3 🥈 45 🥉 -->
    </div>
    <div class="label">hora local (según tu dispositivo)</div>
    <div class="message" id="message">⏳ Contando tus LifeCoins…</div>
  </div>

  <script>
    function updateLifeCoins() {
      const now = new Date();
      const hours = now.getHours();
      const minutes = now.getMinutes();
      const currentMinutes = hours * 60 + minutes;
      const endMinutes = 22 * 60; // 10:00 PM en minutos
      const lifeCoinsEl = document.getElementById("life-coins");
      const messageEl = document.getElementById("message");

      let totalMinutesLeft = endMinutes - currentMinutes;

      if (totalMinutesLeft <= 0) {
        lifeCoinsEl.innerHTML = `0 🥈 0 🥉`;
        messageEl.textContent = "💤 Tiempo agotado – invierte en descansar";
        document.title = "💤 Tiempo agotado - LifeCoins";
      } else {
        let hoursLeft = Math.floor(totalMinutesLeft / 60);
        let minutesLeft = totalMinutesLeft % 60;

        lifeCoinsEl.innerHTML = `
          ${hoursLeft} 🥈 ${minutesLeft} 🥉
        `;
        messageEl.textContent = "⏳ Contando tus LifeCoins hasta las 10:00 PM…";
        document.title = `🪙 ${hoursLeft} 🥈 ${minutesLeft} 🥉 - LifeCoins`;
      }
    }

    // Dark Mode Toggle
    const toggleBtn = document.getElementById("toggleDark");
    toggleBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark");
      if (document.body.classList.contains("dark")) {
        toggleBtn.textContent = "☀️";
      } else {
        toggleBtn.textContent = "🌙";
      }
    });

    // Crear monedas cayendo
    function createFallingCoins() {
      const body = document.querySelector("body");
      const coinTypes = ["🥈", "🥉"];
      setInterval(() => {
        const coin = document.createElement("div");
        coin.classList.add("coin");
        coin.style.left = Math.random() * 100 + "vw";
        coin.style.animationDuration = (Math.random() * 3 + 2) + "s";
        coin.innerText = coinTypes[Math.floor(Math.random() * coinTypes.length)];
        body.appendChild(coin);

        // Eliminar la moneda después de caer
        setTimeout(() => {
          coin.remove();
        }, 5000);
      }, 500); // cada 0.5 segundos aparece una nueva moneda
    }

    updateLifeCoins();
    setInterval(updateLifeCoins, 60000); // Actualiza cada minuto
    createFallingCoins();
  </script>
</body>
</html>
